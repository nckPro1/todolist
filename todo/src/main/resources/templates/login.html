<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Đăng nhập - TodoList</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-indigo-500 to-purple-600 p-4">
<div class="bg-white bg-opacity-10 backdrop-blur-lg rounded-2xl p-8 w-full max-w-md shadow-2xl">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white mb-2">TodoList</h1>
        <p class="text-white text-opacity-80">Đăng nhập để quản lý công việc</p>
    </div>

    <form th:action="@{/auth/login}" method="post" class="space-y-6">
        <div>
            <label for="username" class="block text-sm font-medium text-white mb-2">Username</label>
            <input type="text" id="username" name="username" required
                   placeholder="Nhập username"
                   class="w-full px-4 py-3 rounded-lg bg-white bg-opacity-20 border border-white border-opacity-30
                          text-white placeholder-white placeholder-opacity-70 focus:outline-none focus:ring-2
                          focus:ring-white focus:ring-opacity-50 transition"/>
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-white mb-2">Mật khẩu</label>
            <input type="password" id="password" name="password" required
                   placeholder="Nhập mật khẩu"
                   class="w-full px-4 py-3 rounded-lg bg-white bg-opacity-20 border border-white border-opacity-30
                          text-white placeholder-white placeholder-opacity-70 focus:outline-none focus:ring-2
                          focus:ring-white focus:ring-opacity-50 transition"/>
        </div>

        <button type="submit"
                class="w-full bg-white bg-opacity-20 hover:bg-opacity-30 text-white font-semibold py-3 px-4
                       rounded-lg transition transform hover:scale-105">
            Đăng nhập
        </button>

        <div class="mt-4 text-center">
            <a th:href="@{/auth/forgot-password}" class="text-sm text-white hover:underline">
                Quên mật khẩu?
            </a>
        </div>
    </form>

    <div class="mt-6 text-center">
        <p class="text-white text-opacity-80">
            Chưa có tài khoản?
            <a th:href="@{/auth/register}" class="text-white font-semibold hover:underline">Đăng ký ngay</a>
        </p>
    </div>

    <div class="mt-4 text-center">
        <p th:if="${param.error}" class="text-red-400">❌ Sai username hoặc mật khẩu!</p>
        <p th:if="${param.logout}" class="text-green-400">✅ Đăng xuất thành công!</p>
        <p th:if="${param.registerSuccess}" class="text-green-400">🎉 Đăng ký thành công, mời đăng nhập!</p>
        <p th:if="${param.resetSuccess}" class="text-green-400">🔑 Đặt lại mật khẩu thành công!</p>
    </div>
</div>
</body>
</html>
