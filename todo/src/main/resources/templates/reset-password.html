<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Đặt lại mật khẩu - TodoList</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-indigo-500 to-purple-600 p-4">
<div class="bg-white bg-opacity-10 backdrop-blur-lg rounded-2xl p-8 w-full max-w-md shadow-2xl">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-white mb-2">Đặt lại mật khẩu</h1>
        <p class="text-white text-opacity-80">Nhập mật khẩu mới của bạn</p>
    </div>

    <form th:action="@{/auth/reset-password}" method="post" class="space-y-6" onsubmit="return validatePasswords()">
        <input type="hidden" name="token" th:value="${token}"/>

        <div>
            <label class="block text-sm font-medium text-white mb-2">Mật khẩu mới</label>
            <input type="password" id="newPassword" name="newPassword" required placeholder="Nhập mật khẩu mới"
                   class="w-full px-4 py-3 rounded-lg bg-white bg-opacity-20 border border-white border-opacity-30
                          text-white placeholder-white focus:outline-none focus:ring-2 focus:ring-white"/>
        </div>
        <div>
            <label class="block text-sm font-medium text-white mb-2">Xác nhận mật khẩu</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Nhập lại mật khẩu"
                   class="w-full px-4 py-3 rounded-lg bg-white bg-opacity-20 border border-white border-opacity-30
                          text-white placeholder-white focus:outline-none focus:ring-2 focus:ring-white"/>
            <p id="passwordError" class="text-red-400 text-sm mt-2 hidden">Mật khẩu xác nhận không khớp</p>
        </div>

        <button type="submit"
                class="w-full bg-white bg-opacity-20 hover:bg-opacity-30 text-white font-semibold py-3 px-4
                       rounded-lg transition transform hover:scale-105">
            Đặt lại mật khẩu
        </button>
    </form>

    <div class="mt-4 text-center">
        <p th:if="${error}" th:text="${error}" class="text-red-400"></p>
    </div>

    <div class="mt-6 text-center">
        <a th:href="@{/auth/login}" class="text-white hover:underline">Quay lại đăng nhập</a>
    </div>
</div>

<script>
    function validatePasswords() {
        const pass = document.getElementById("newPassword").value;
        const confirm = document.getElementById("confirmPassword").value;
        const error = document.getElementById("passwordError");
        if (pass !== confirm) {
            error.classList.remove("hidden");
            return false;
        }
        error.classList.add("hidden");
        return true;
    }
</script>
</body>
</html>
