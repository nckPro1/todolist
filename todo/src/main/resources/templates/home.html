<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Trang chủ - TodoList</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-r from-indigo-500 to-purple-600 text-white flex flex-col">

<!-- Header -->
<header class="bg-white bg-opacity-10 backdrop-blur-lg shadow-md p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">TodoList App</h1>
    <form th:action="@{/auth/logout}" method="post">
        <button type="submit"
                class="px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg text-white font-semibold transition">
            Đăng xuất
        </button>
    </form>
</header>

<!-- Nội dung chính -->
<main class="flex-1 flex flex-col items-center justify-center p-6">
    <h2 class="text-2xl font-bold mb-4">Xin chào, <span th:text="${username}"></span> 👋</h2>
    <p class="text-white text-opacity-80 mb-8">Chào mừng bạn đến với TodoList</p>

    <!-- Ví dụ danh sách công việc -->
    <div class="bg-white bg-opacity-10 backdrop-blur-lg rounded-2xl p-6 w-full max-w-lg shadow-xl">
        <h3 class="text-lg font-semibold mb-4">Danh sách công việc (demo)</h3>
        <ul class="space-y-2">
            <li class="bg-white bg-opacity-20 px-4 py-2 rounded-lg">✅ Học Spring Boot</li>
            <li class="bg-white bg-opacity-20 px-4 py-2 rounded-lg">📧 Hoàn thiện tính năng Forgot Password</li>
            <li class="bg-white bg-opacity-20 px-4 py-2 rounded-lg">📝 Viết thêm chức năng quản lý Todo</li>
        </ul>
    </div>
</main>

<!-- Footer -->
<footer class="text-center py-4 text-white text-opacity-60">
    © 2025 TodoList App. All rights reserved.
</footer>

</body>
</html>
