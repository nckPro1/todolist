<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Quên mật khẩu - TodoList</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-indigo-500 to-purple-600 p-4">
<div class="bg-white bg-opacity-10 backdrop-blur-lg rounded-2xl p-8 w-full max-w-md shadow-2xl">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-white mb-2">Quên mật khẩu</h1>
        <p class="text-white text-opacity-80">Nhập email để nhận link đặt lại mật khẩu</p>
    </div>

    <form th:action="@{/auth/forgot-password}" method="post" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-white mb-2">Email</label>
            <input type="email" name="email" required placeholder="Nhập email"
                   class="w-full px-4 py-3 rounded-lg bg-white bg-opacity-20 border border-white border-opacity-30
                          text-white placeholder-white focus:outline-none focus:ring-2 focus:ring-white"/>
        </div>
        <button type="submit"
                class="w-full bg-white bg-opacity-20 hover:bg-opacity-30 text-white font-semibold py-3 px-4
                       rounded-lg transition transform hover:scale-105">
            Gửi link đặt lại mật khẩu
        </button>
    </form>

    <div class="mt-4 text-center">
        <p th:if="${message}" th:text="${message}" class="text-green-400"></p>
        <p th:if="${error}" th:text="${error}" class="text-red-400"></p>
    </div>

    <div class="mt-6 text-center">
        <a th:href="@{/auth/login}" class="text-white hover:underline">Quay lại đăng nhập</a>
    </div>
</div>
</body>
</html>
